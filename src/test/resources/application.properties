# Configuracion exclusiva de los tests: Spring Boot le da precedencia sobre
# src/main/resources/application.properties cuando corre la suite.
#
# Base en memoria para que los tests con @SpringBootTest o @DataJpaTest no
# dependan de tener Docker levantado.
spring.application.name=taller-mecanico-backend

# --- Datasource H2 (en memoria, se crea y se destruye con cada corrida) ---
spring.datasource.url=jdbc:h2:mem:tallerdb-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# --- CORS ---
app.cors.origenes=http://localhost:*

app.jwt.secreto=clave-solo-para-tests-con-largo-suficiente-para-firmar-hs256
app.jwt.expiracion-ms=3600000
app.admin.usuario=admin
app.admin.contrasena=admin1234
