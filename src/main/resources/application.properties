spring.application.name=taller-mecanico-backend

# --- Datasource PostgreSQL (docker-compose.yml) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/tallerdb
spring.datasource.username=taller
spring.datasource.password=taller

# --- JPA / Hibernate ---
# El Service expone solo DTOs: ninguna asociacion LAZY llega a la capa web,
# asi que OSIV no aporta nada y solo enmascararia problemas de N+1.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
