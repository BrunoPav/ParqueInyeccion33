spring.application.name=taller-mecanico-backend

# --- Datasource PostgreSQL ---
# Los defaults son los del docker-compose local; en la nube se sobreescriben por
# variables de entorno, asi que no hay credenciales de produccion en el repositorio.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tallerdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:taller}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:taller}

# Los PaaS asignan el puerto por la variable PORT y no dejan elegirlo.
server.port=${PORT:8080}

# --- JPA / Hibernate ---
# El Service expone solo DTOs: ninguna asociacion LAZY llega a la capa web,
# asi que OSIV no aporta nada y solo enmascararia problemas de N+1.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
