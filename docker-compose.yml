services:
  postgres:
    image: postgres:17-alpine
    container_name: taller-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tallerdb
      POSTGRES_USER: taller
      POSTGRES_PASSWORD: taller
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taller -d tallerdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Solo arranca con: docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: taller-pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@taller.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  pgadmin-data:
