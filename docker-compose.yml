services:
  app:
    build: .
    container_name: taller-app
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tallerdb
      SPRING_DATASOURCE_USERNAME: taller
      SPRING_DATASOURCE_PASSWORD: taller
      SPRING_JPA_SHOW_SQL: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    container_name: taller-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tallerdb
      POSTGRES_USER: taller
      POSTGRES_PASSWORD: taller
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ espera el volumen un nivel arriba de /data: adentro
      # organiza los datos en subcarpetas por version mayor.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taller -d tallerdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Solo arranca con: docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: taller-pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@taller.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  pgadmin-data:
